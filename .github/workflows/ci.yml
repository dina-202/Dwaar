name: Dwaar CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "product/**"
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app.py domain modules workflows tests

      - name: Run offline unit suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
